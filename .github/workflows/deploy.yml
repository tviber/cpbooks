name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the local C++ runner
        run: npm run runner:build

      - name: Run lesson tests
        run: npm test

      - name: Exercise both C++ comparators and runner diagnostics
        run: npm run test:runner

      - name: Verify published walkthroughs against live C++ executions
        run: node scripts/starter-traces.js --check

      - name: Build website
        run: npm run build

  deploy:
    name: Trigger server deployment
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: cpbooks-deploy-main
      cancel-in-progress: false
    steps:
      - name: Send signed deployment notification
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: https://txc.cp4.fun/hooks/deploy-main
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_WEBHOOK_SECRET" ]]; then
            echo '::error::Configure the repository Actions secret DEPLOY_WEBHOOK_SECRET to match /etc/webhook-secret on the deployment server.'
            exit 1
          fi

          DEPLOY_PAYLOAD_DIR=$(mktemp -d)
          export DEPLOY_PAYLOAD_DIR
          trap 'rm -rf "$DEPLOY_PAYLOAD_DIR"' EXIT

          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const { GITHUB_REF, GITHUB_SHA, GITHUB_REPOSITORY, DEPLOY_WEBHOOK_SECRET, DEPLOY_PAYLOAD_DIR } = process.env;
          if (GITHUB_REF !== 'refs/heads/main' || GITHUB_REPOSITORY !== 'tviber/cpbooks' || !/^[0-9a-f]{40}$/.test(GITHUB_SHA) || /^0{40}$/.test(GITHUB_SHA)) {
            throw new Error('Deployment requires a valid commit on tviber/cpbooks main.');
          }
          const payload = JSON.stringify({
            ref: GITHUB_REF,
            after: GITHUB_SHA,
            repository: { full_name: GITHUB_REPOSITORY },
          });
          const signature = createHmac('sha256', DEPLOY_WEBHOOK_SECRET).update(payload).digest('hex');
          writeFileSync(join(DEPLOY_PAYLOAD_DIR, 'payload.json'), payload, { mode: 0o600 });
          writeFileSync(join(DEPLOY_PAYLOAD_DIR, 'headers'), `Content-Type: application/json\nX-Hub-Signature-256: sha256=${signature}\n`, { mode: 0o600 });
          NODE

          # No automatic retry: the server starts deployment asynchronously.
          status=$(curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 60 \
            --request POST \
            --header "@$DEPLOY_PAYLOAD_DIR/headers" \
            --data-binary "@$DEPLOY_PAYLOAD_DIR/payload.json" \
            --output "$DEPLOY_PAYLOAD_DIR/response" \
            --write-out '%{http_code}' \
            "$DEPLOY_WEBHOOK_URL")
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Deployment webhook returned HTTP $status."
            exit 1
          fi

          {
            echo '### Deployment notification accepted'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            echo 'The server builds asynchronously. HTTP acceptance does not confirm a successful deployment.'
            echo 'Check `/var/log/deploy-webhook.log` on the server for the final result.'
          } >> "$GITHUB_STEP_SUMMARY"
